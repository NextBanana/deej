name: Build

on:
  push:
    paths-ignore:
      - "**.md"
      - "assets/**"
      - "docs/**"
  workflow_dispatch:

jobs:
  windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # the build scripts call `git rev-list` and `git describe --tags`,
          # so the full history and all tags need to be present
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # takes the version straight from the `go` directive in go.mod,
          # so this never drifts out of sync again
          go-version-file: go.mod
          cache: true

      - name: Build deej (release)
        run: pkg\deej\scripts\windows\build-release.bat
        shell: cmd

      - name: Build deej (dev)
        run: pkg\deej\scripts\windows\build-dev.bat
        shell: cmd

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: deej-windows-run${{ github.run_number }}
          path: |
            deej-release.exe
            deej-dev.exe
          if-no-files-found: error
          retention-days: 30
